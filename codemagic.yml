workflows:
  theos-build:
    name: Build FFESP dylib
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        THEOS: /Users/builder/theos
    scripts:
      - name: Install Theos
        script: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
      - name: Install ldid
        script: |
          brew install ldid || true
      - name: Build dylib
        script: |
          export PATH=$THEOS/bin:$PATH
          make clean
          make package FINALPACKAGE=1
    artifacts:
      - .theos/obj/FFESP.dylib
      - .theos/obj/FFESP.dylib.dSYM
